[project]
name = "gaussian-law-exp"
version = "0.1.0"
description = "Distributional operator experiment for Gaussian law prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "h5py==3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=1.26",
    "omegaconf>=2.3,<3",
    "pandas>=3.0.5",
    "pyyaml>=6",
    "torch==2.5.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
testpaths = ["tests"]
