experiment:
  name: gaussian_law
  output_root: experiments
  seed: 0
  device: auto

data:
  file: data/dataset.h5
  train_size: 1000
  test_size: 200
  split_seed: 0
  batch_size: 64
  num_workers: 0
  pin_memory: false

model:
  # Options: distributional_operator, momentmlp, kernel_regression
  name: momentmlp
  hidden_width: 128
  hidden_layers: 4
  inner_width: 64
  inner_layers: 2
  embedding_dim: 64
  outer_width: 128
  outer_layers: 3
  activation: gelu
  initial_scale: 0.1
  covariance_structure: full
  covariance_rank: 4
  kernel_bandwidth: 1.0
  kernel_top_k: null

loss:
  name: gaussian_nll
  covariance_epsilon: 1.0e-5
  param_weight: 1.0
  mean_weight: 1.0
  covariance_weight: 1.0

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.01

scheduler:
  # Options: reduce_lr_on_plateau, cosine_annealing, step_lr, none
  name: reduce_lr_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8
  # Used by cosine_annealing.
  t_max: 300
  eta_min: 1.0e-6
  # Used by step_lr.
  step_size: 50
  gamma: 0.5

training:
  epochs: 1000
  validation_interval: 10
  grad_clip: null
  save_last: true
  checkpoint_selection_metric: val.observable_metrics.nll
