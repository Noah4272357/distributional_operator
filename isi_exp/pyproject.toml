[project]
name = "isi-exp"
version = "0.1.0"
description = "Standalone configuration-driven ISI law-to-law experiment"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "h5py==3.14.0",
    "matplotlib==3.9.2",
    "numpy==2.0.2",
    "omegaconf>=2.3,<3",
    "torch==2.7.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
