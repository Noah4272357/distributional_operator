[project]
name = "isi-exp"
version = "0.1.0"
description = "Standalone configuration-driven ISI law-to-law experiment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "h5py>=3.11",
    "omegaconf>=2.3,<3",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
