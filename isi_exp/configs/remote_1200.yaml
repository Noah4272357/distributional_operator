experiment:
  name: isi_all_models_n1200_s200_seed0
  output_root: experiments/remote_n1200_s200_seed0_e300
  seed: 0
  device: cuda

data:
  file: data/generated/isi_lif_laws_n1200_s200_seed0.h5
  train_size: 1000
  val_size: 200
  test_size: 0
  split_seed: 0
  batch_size: 64
  num_workers: 0
  pin_memory: false

model:
  name: isi_context_deepsets
  hidden_width: 32
  hidden_layers: 1
  inner_width: 32
  inner_layers: 1
  embedding_dim: 32
  outer_width: 32
  outer_layers: 1
  activation: gelu
  bandwidth: 0.15
  input_bins: 32
  distance_chunk_size: 256

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.01

scheduler:
  name: reduce_lr_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8

training:
  epochs: 300
  epoch_metrics: nll_only
  grad_clip: null
  save_last: true
  checkpoint_selection_metric: val.observable_metrics.observation_nll
