experiment:
  name: isi_feature_mlp_1000
  output_root: experiments/feature_mlp
  seed: 0
  device: cuda

data:
  file: data/generated/isi_distribution_dataset.h5
  train_size: 1000
  val_size: 200
  test_size: 0
  split_seed: 0
  batch_size: 64
  num_workers: 0
  pin_memory: false

model:
  name: isi_feature_mlp
  hidden_width: 32
  hidden_layers: 1
  activation: gelu

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.01

scheduler:
  name: reduce_lr_on_plateau
  mode: min
  factor: 0.5
  patience: 20
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8

training:
  epochs: 1000
  epoch_metrics: nll_only
  grad_clip: null
  save_last: true
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 0.001
  checkpoint_selection_metric: val.observable_metrics.observation_nll
