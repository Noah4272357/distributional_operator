experiment:
  name: kernel_regression
  output_root: experiments
  seed: 0
  device: cpu

data:
  file: data/generated/isi_lif_laws.h5
  train_size: 999
  val_size: 120
  test_size: 120
  split_seed: 0
  batch_size: 64
  num_workers: 0
  pin_memory: false

model:
  name: kernel_regression
  bandwidth: 0.15
  input_bins: 32
  distance_chunk_size: 256

optimizer:
  name: none

scheduler:
  name: none

training:
  epochs: 0
  epoch_metrics: nll_only
  grad_clip: null
  save_last: true
  checkpoint_selection_metric: val.observable_metrics.observation_nll
