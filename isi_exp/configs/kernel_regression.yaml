experiment:
  name: kernel_regression
  output_root: experiments
  seed: 0
  device: cpu

data:
  file: data/generated/isi_distribution_dataset.h5
  train_size: 1000
  val_size: 200
  test_size: 0
  split_seed: 0
  batch_size: 64
  num_workers: 0
  pin_memory: false

model:
  name: kernel_regression
  bandwidth: 0.15
  input_bins: 32
  distance_chunk_size: 256

optimizer:
  name: none

scheduler:
  name: none

training:
  epochs: 0
  epoch_metrics: nll_only
  grad_clip: null
  save_last: true
  early_stopping:
    enabled: false
    patience: 30
    min_delta: 0.001
  checkpoint_selection_metric: val.observable_metrics.observation_nll
