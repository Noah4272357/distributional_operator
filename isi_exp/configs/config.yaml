experiment:
  name: isi_law_to_law
  output_root: experiments
  seed: 0
  device: cpu

data:
  file: data/generated/isi_lif_laws_smoke.h5
  train_size: 12
  val_size: 6
  test_size: 6
  split_seed: 0
  batch_size: 8
  num_workers: 0
  pin_memory: false

model:
  name: isi_context_deepsets
  hidden_width: 32
  hidden_layers: 1
  inner_width: 32
  inner_layers: 1
  embedding_dim: 32
  outer_width: 32
  outer_layers: 1
  activation: gelu

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 0.01

scheduler:
  # Options: reduce_lr_on_plateau, cosine_annealing, step_lr, none
  name: reduce_lr_on_plateau
  mode: min
  factor: 0.5
  patience: 5
  threshold: 1.0e-4
  threshold_mode: rel
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8
  # Used by cosine_annealing.
  t_max: 300
  eta_min: 1.0e-6
  # Used by step_lr.
  step_size: 50
  gamma: 0.5

training:
  epochs: 2
  grad_clip: null
  save_last: true
  checkpoint_selection_metric: val.observable_metrics.observation_nll
