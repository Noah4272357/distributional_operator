[project]
name = "mv-field-exp"
version = "0.1.0"
description = "Standalone configuration-driven McKean--Vlasov random-field experiment"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.11",
  "geomloss>=0.2.6,<0.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyyaml>=6",
  "torch>=2.8,<2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
