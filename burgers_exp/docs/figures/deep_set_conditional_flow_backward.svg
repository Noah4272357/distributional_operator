<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040">
  <defs>
    <marker id="arrow-forward" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#273B5B"/>
    </marker>
    <marker id="arrow-grad" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C43B3B"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #18212F; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #4D5A6C; }
      .section { font-size: 18px; font-weight: 700; fill: #273B5B; }
      .node { fill: #F8FAFC; stroke: #6B7C93; stroke-width: 1.6; rx: 12; }
      .learned { fill: #E8F1FF; stroke: #3974B8; stroke-width: 1.8; rx: 12; }
      .operator { fill: #F1F4F8; stroke: #7C8798; stroke-width: 1.5; rx: 9; }
      .loss { fill: #FFF0E7; stroke: #D97837; stroke-width: 2; rx: 12; }
      .constant { fill: #F5F2FA; stroke: #8B74A8; stroke-width: 1.5; rx: 12; }
      .param { fill: #FFF8DA; stroke: #B98C12; stroke-width: 1.5; rx: 9; }
      .main { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .small { font-size: 13px; fill: #46556A; text-anchor: middle; }
      .tiny { font-size: 12px; fill: #5D6878; }
      .forward { fill: none; stroke: #273B5B; stroke-width: 2.2; marker-end: url(#arrow-forward); }
      .branch { fill: none; stroke: #273B5B; stroke-width: 1.8; marker-end: url(#arrow-forward); }
      .gradient { fill: none; stroke: #C43B3B; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrow-grad); }
      .gradient-thin { fill: none; stroke: #C43B3B; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow-grad); }
      .nograd { fill: none; stroke: #9AA4B2; stroke-width: 1.5; stroke-dasharray: 3 5; }
    </style>
  </defs>

  <rect width="1680" height="1040" fill="#FFFFFF"/>
  <g id="heading">
    <text x="60" y="58" class="title">DeepSetConditionalFlow: graph traversed by loss.backward()</text>
    <text x="60" y="88" class="subtitle">Actual training path: predictions = model(inputs); loss = SinkhornLoss(predictions, targets). Solid navy = forward tensors; dashed red = reverse-mode gradients.</text>
  </g>

  <g id="forward-computational-graph">
    <text x="60" y="142" class="section">Forward graph recorded by PyTorch autograd</text>

    <g id="input-set">
      <rect x="60" y="190" width="150" height="72" class="node"/>
      <text x="135" y="220" class="main">input set X</text>
      <text x="135" y="244" class="small">[B, N, Dᵢₙ]</text>
    </g>
    <g id="phi-mlp">
      <rect x="260" y="190" width="170" height="72" class="learned"/>
      <text x="345" y="218" class="main">φ MLP</text>
      <text x="345" y="242" class="small">per sample → [B,N,128]</text>
    </g>
    <g id="aggregation">
      <rect x="480" y="176" width="190" height="100" class="operator"/>
      <text x="575" y="207" class="main">mean + std</text>
      <text x="575" y="231" class="small">μ = mean(h)</text>
      <text x="575" y="252" class="small">σ = √mean((h−μ)²+ε)</text>
    </g>
    <g id="rho-mlp">
      <rect x="720" y="190" width="160" height="72" class="learned"/>
      <text x="800" y="218" class="main">ρ MLP</text>
      <text x="800" y="242" class="small">context c [B,128]</text>
    </g>
    <g id="expand-context">
      <rect x="930" y="190" width="170" height="72" class="operator"/>
      <text x="1015" y="218" class="main">expand + reshape</text>
      <text x="1015" y="242" class="small">c̃ [B·N,128]</text>
    </g>

    <path d="M210 226 L260 226" class="forward"/>
    <path d="M430 226 L480 226" class="forward"/>
    <path d="M670 226 L720 226" class="forward"/>
    <path d="M880 226 L930 226" class="forward"/>

    <g id="latent-noise">
      <rect x="60" y="360" width="190" height="76" class="constant"/>
      <text x="155" y="389" class="main">ε ~ Normal(0,I)</text>
      <text x="155" y="413" class="small">temperature · ε [B,N,Dₒᵤₜ]</text>
    </g>
    <g id="latent-reshape">
      <rect x="300" y="362" width="150" height="72" class="operator"/>
      <text x="375" y="391" class="main">reshape</text>
      <text x="375" y="415" class="small">z₈ [B·N,Dₒᵤₜ]</text>
    </g>
    <path d="M250 398 L300 398" class="forward"/>

    <g id="inverse-flow">
      <rect x="500" y="330" width="650" height="140" fill="#F8FBFF" stroke="#9AB6D6" stroke-width="1.6" rx="16"/>
      <text x="825" y="357" class="main">from_latent(): inverse conditional RealNVP</text>
      <g id="inverse-coupling-8">
        <rect x="530" y="380" width="135" height="60" class="learned"/>
        <text x="597.5" y="405" class="main">Coupling 8⁻¹</text>
        <text x="597.5" y="426" class="small">θ₈, mask₈</text>
      </g>
      <g id="inverse-coupling-middle">
        <rect x="715" y="380" width="135" height="60" class="learned"/>
        <text x="782.5" y="405" class="main">Coupling 7⁻¹</text>
        <text x="782.5" y="426" class="small">θ₇, mask₇</text>
      </g>
      <text x="895" y="417" font-size="24" text-anchor="middle" fill="#6B7C93">…</text>
      <g id="inverse-coupling-1">
        <rect x="965" y="380" width="150" height="60" class="learned"/>
        <text x="1040" y="405" class="main">Coupling 1⁻¹</text>
        <text x="1040" y="426" class="small">θ₁, mask₁</text>
      </g>
      <path d="M665 410 L715 410" class="forward"/>
      <path d="M850 410 L875 410" class="forward"/>
      <path d="M915 410 L965 410" class="forward"/>
    </g>
    <path d="M450 398 L500 398" class="forward"/>
    <path d="M1015 262 L1015 309 L825 309 L825 330" class="branch"/>
    <text x="842" y="304" class="tiny">same c̃ conditions every inverse layer</text>

    <g id="prediction-reshape">
      <rect x="1200" y="362" width="170" height="72" class="operator"/>
      <text x="1285" y="391" class="main">reshape</text>
      <text x="1285" y="415" class="small">prediction Ŷ [B,N,Dₒᵤₜ]</text>
    </g>
    <path d="M1150 398 L1200 398" class="forward"/>

    <g id="target-set">
      <rect x="1200" y="515" width="170" height="72" class="constant"/>
      <text x="1285" y="544" class="main">target Y</text>
      <text x="1285" y="568" class="small">[B,N,Dₒᵤₜ]</text>
    </g>
    <g id="sinkhorn-loss">
      <rect x="1430" y="405" width="190" height="110" class="loss"/>
      <text x="1525" y="438" class="main">Sinkhorn divergence</text>
      <text x="1525" y="463" class="small">p=2, blur=0.05</text>
      <text x="1525" y="486" class="small">mean → scalar loss L</text>
    </g>
    <path d="M1370 398 L1400 398 L1400 445 L1430 445" class="forward"/>
    <path d="M1370 551 L1400 551 L1400 480 L1430 480" class="forward"/>
  </g>

  <g id="backward-gradient-graph">
    <text x="60" y="652" class="section">Reverse traversal initiated by loss.backward()</text>
    <path d="M1430 502 L1387 502 L1387 615 L1168 615 L1168 455 L1150 455" class="gradient"/>
    <text x="1268" y="608" class="tiny" fill="#C43B3B">∂L/∂Ŷ</text>
    <path d="M1120 455 L955 455" class="gradient"/>
    <path d="M945 455 L840 455" class="gradient"/>
    <path d="M705 455 L520 455 L520 488 L450 488 L450 436" class="gradient"/>
    <text x="770" y="482" class="tiny" fill="#C43B3B">vector–Jacobian products through exp, subtract, multiply, masks, and each coupling MLP</text>

    <path d="M1050 470 L1050 554 L1015 554 L1015 470" class="gradient-thin"/>
    <path d="M800 470 L800 572 L1015 572 L1015 470" class="gradient-thin"/>
    <path d="M590 470 L590 590 L1015 590 L1015 470" class="gradient-thin"/>
    <text x="792" y="612" class="tiny" fill="#C43B3B">context-gradient contributions from all 8 layers sum at c̃</text>
    <path d="M1015 190 L1015 158 L800 158 L800 190" class="gradient"/>
    <path d="M720 208 L670 208" class="gradient"/>
    <path d="M480 208 L430 208" class="gradient"/>
    <text x="564" y="164" class="tiny" fill="#C43B3B">∂L/∂c → ρ → aggregation → φ</text>

    <g id="parameter-gradients">
      <rect x="160" y="742" width="190" height="72" class="param"/>
      <text x="255" y="770" class="main">φ parameters</text>
      <text x="255" y="794" class="small">accumulate .grad</text>
      <rect x="430" y="742" width="190" height="72" class="param"/>
      <text x="525" y="770" class="main">ρ parameters</text>
      <text x="525" y="794" class="small">accumulate .grad</text>
      <rect x="760" y="742" width="250" height="72" class="param"/>
      <text x="885" y="770" class="main">coupling MLP θ₁…θ₈</text>
      <text x="885" y="794" class="small">each accumulates weight/bias .grad</text>
      <path d="M345 262 L345 710 L255 710 L255 742" class="gradient-thin"/>
      <path d="M800 262 L800 690 L525 690 L525 742" class="gradient-thin"/>
      <path d="M825 470 L825 705 L885 705 L885 742" class="gradient-thin"/>
    </g>

    <g id="no-gradient-notes">
      <rect x="1090" y="720" width="530" height="120" fill="#FAFAFB" stroke="#C7CDD6" stroke-width="1.2" rx="12"/>
      <text x="1115" y="750" font-size="15" font-weight="700">Leaves / buffers without trainable gradients</text>
      <text x="1115" y="778" class="tiny">• ε is sampled with requires_grad=False; backward stops at the latent sample.</text>
      <text x="1115" y="801" class="tiny">• target Y normally has requires_grad=False; Sinkhorn uses it to form ∂L/∂Ŷ only.</text>
      <text x="1115" y="824" class="tiny">• alternating masks are registered buffers, so no mask .grad is produced.</text>
    </g>
  </g>

  <g id="coupling-detail">
    <rect x="60" y="882" width="1560" height="105" fill="#F7FAFE" stroke="#A6B9CF" stroke-width="1.3" rx="14"/>
    <text x="82" y="911" font-size="15" font-weight="700">Inside each inverse coupling k (compressed above)</text>
    <text x="82" y="940" font-size="14">u = concat(y ⊙ mₖ, c̃) → networkₖ(u) → chunk(s_raw, t_raw) → s = scale_limit · tanh(s_raw / scale_limit) ⊙ (1−mₖ)</text>
    <text x="82" y="967" font-size="14">x = mₖ ⊙ y + (1−mₖ) ⊙ [(y−t) ⊙ exp(−s)]    |    backward differentiates this expression and the network; the inverse log-determinant is computed but discarded by sample().</text>
  </g>
</svg>
